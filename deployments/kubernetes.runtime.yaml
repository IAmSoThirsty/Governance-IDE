apiVersion: v1
kind: Namespace
metadata:
  name: sovereign-ide
---
apiVersion: v1
kind: Secret
metadata:
  name: sovereign-ide-secrets
  namespace: sovereign-ide
type: Opaque
stringData:
  SOVEREIGN_SIGNING_KEY: replace-through-secret-manager
  SOVEREIGN_SERVICE_TOKEN: replace-through-secret-manager
  HF_TOKEN: replace-through-secret-manager
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sovereign-ide-runtime-config
  namespace: sovereign-ide
data:
  SOVEREIGN_POLICY_PATH: policies/baseline_policy.json
  SOVEREIGN_STATE_DIR: /app/state
  SOVEREIGN_TRAINING_BACKEND: huggingface-jobs
  SOVEREIGN_TRAINING_COMMAND: python scripts/trainers/trl_sft_trainer.py
  SOVEREIGN_HUB_MODEL_ID: replace-org/replace-model
  SOVEREIGN_TRAINING_ARTIFACT_STORE: https://huggingface.co/replace-org/replace-model
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sovereign-ide-state
  namespace: sovereign-ide
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sovereign-ide-runtime
  namespace: sovereign-ide
  labels:
    app.kubernetes.io/name: sovereign-ide-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sovereign-ide-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sovereign-ide-runtime
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: registry.example.com/sovereign/sovereign-ide-runtime@sha256:replace-with-pushed-image-digest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8765
          envFrom:
            - secretRef:
                name: sovereign-ide-secrets
            - configMapRef:
                name: sovereign-ide-runtime-config
          volumeMounts:
            - name: state
              mountPath: /app/state
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import json, os, urllib.request; req=urllib.request.Request('http://127.0.0.1:8765/ready', headers={'Authorization':'Bearer '+os.environ['SOVEREIGN_SERVICE_TOKEN']}); data=json.load(urllib.request.urlopen(req, timeout=3)); raise SystemExit(0 if data.get('status') == 'ready' else 1)"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: sovereign-ide-state
---
apiVersion: v1
kind: Service
metadata:
  name: sovereign-ide-runtime
  namespace: sovereign-ide
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sovereign-ide-runtime
  ports:
    - name: http
      port: 8765
      targetPort: http
