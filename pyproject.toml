[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-ide"
version = "0.1.0"
description = "Governance-first sovereign AI IDE runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"cryptography>=42.0.0",
]

[project.scripts]
sovereign-ide = "sovereign_ide.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
