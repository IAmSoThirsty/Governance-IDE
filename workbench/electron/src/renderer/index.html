<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sovereign IDE Workbench</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <aside class="sidebar">
      <h1>Sovereign IDE</h1>
      <nav>
        <button data-panel="models" class="active">Models</button>
        <button data-panel="training">Fine-Tuning</button>
        <button data-panel="policy">Policy</button>
        <button data-panel="audit">Audit</button>
        <button data-panel="approvals">Approvals</button>
        <button data-panel="evidence">Evidence</button>
      </nav>
    </aside>
    <main>
      <header>
        <div>
          <span class="eyebrow">Governed Runtime</span>
          <h2 id="panel-title">Models</h2>
        </div>
        <div class="status" id="runtime-status">checking</div>
      </header>
      <section id="panel-body" class="panel"></section>
    </main>
    <script src="workbench.js"></script>
  </body>
</html>
